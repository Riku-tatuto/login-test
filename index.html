<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ログインフォーム</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <!-- ログイン処理用スクリプト -->
    <script type="module" src="auth.js"></script>
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-container">
        <a href="#" class="logo">test-login</a>
        <nav class="menu">
          <a href="#">ホーム</a>
          <!-- ログイン後、このリンクはユーザーのメールアドレス表示＆ドロップダウンに変わる -->
          <div class="account-dropdown" id="account-dropdown">
            <button id="account-btn">ログイン</button>
            <div class="dropdown-content" id="dropdown-content">
              <a href="#" id="logout-btn">ログアウト</a>
            </div>
          </div>
        </nav>
      </div>
    </header>
    <div id="login-box">
      <div class="left-box">
        <h1>ログイン</h1>
        <input type="text" id="email" placeholder="メールアドレス" />
        <input type="submit" id="login-button" value="ログイン（メールリンク送信）" />
        <!-- 新規作成ボタン -->
        <button id="goto-signup">アカウントを新規作成</button>
      </div>
      <div class="right-box">
        <span class="loginwith">SNSでログイン</span>
        <button class="sns google" id="google-login">Googleでログイン</button>
      </div>
    </div>

    <!-- signup.html に遷移 -->
    <script>
      document.getElementById('goto-signup').addEventListener('click', ()=> {
        location.href = 'signup.html';
      });
    </script>
  </body>
</html>
