<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>ログインフォーム</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Firebase SDK はモジュールとして読み込む -->
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <!-- 認証ロジック -->
    <script type="module" src="auth.js"></script>
    <!-- Faviconを指定（存在しない場合は用意する） -->
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-container">
        <a href="#" class="logo">test-login</a>
        <nav class="menu">
          <a href="#">ホーム</a>
          <div class="account-dropdown" id="account-dropdown">
            <button id="account-btn">ログイン</button>
            <div class="dropdown-content" id="dropdown-content">
              <a href="#" id="logout-btn">ログアウト</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <div id="login-box">
      <div class="left-box">
        <h1>ログイン</h1>
        <input type="email" id="email" placeholder="メールアドレス" />
        <input type="submit" id="login-button" value="ログイン（メールリンク送信）" />
        <button id="goto-signup">アカウントを新規作成</button>
      </div>
      <div class="right-box">
        <span class="loginwith">SNSでログイン</span>
        <button class="sns google" id="google-login">Googleでログイン</button>
      </div>
    </div>

    <script>
      // サインアップ画面へ
      document.getElementById('goto-signup').addEventListener('click', () => {
        location.href = 'signup.html';
      });
    </script>
  </body>
</html>
