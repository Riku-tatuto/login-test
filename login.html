<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ログインフォーム</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <!-- ログイン処理用スクリプト -->
    <script type="module" src="login.js"></script>
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-container">
        <a href="#" class="logo">test-login</a>
        <nav class="menu">
          <a href="#">ホーム</a>
          <a href="#">ログイン</a>
        </nav>
        <button class="toggle-button">☰</button>
      </div>
    </header>
    <div id="login-box">
      <div class="left-box">
        <h1>ログイン</h1>
        <input type="text" name="email" id="email" placeholder="メールアドレス" />
        <input type="password" name="password" id="password" placeholder="パスワード" />
        <input type="submit" id="login-button" value="ログイン" />
      </div>

      <div class="right-box">
        <span class="loginwith">SNSでログイン</span>
        <!-- Googleログインのみ -->
        <button class="sns google" id="google-login">Googleでログイン</button>
      </div>
    </div>
  </body>
</html>
