<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>アカウント作成</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-container">
        <a href="#" class="logo">test-login</a>
        <nav class="menu">
          <a href="#">ホーム</a>
          <div class="account-dropdown">
            <button id="account-btn">ログイン</button>
            <div class="dropdown-content">
              <a href="#" id="logout-btn">ログアウト</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <div id="signup-box">
      <div class="left-box">
        <h1>アカウント作成</h1>
        <input type="email" id="signup-email" placeholder="メールアドレス" />
        <input type="password" id="signup-password" placeholder="パスワード" />
        <input type="password" id="signup-confirm" placeholder="パスワード（確認用）" />
        <input type="submit" id="signup-button" value="作成" />
        <button id="goto-login" class="link-button">ログイン画面へ戻る</button>
      </div>
    </div>
    <script>
      document.getElementById('goto-login').addEventListener('click', () => location.href = 'login.html');
    </script>
  </body>
</html>
